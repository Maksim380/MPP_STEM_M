# docker compose up --build  →  дашборд на http://localhost:8080
# Секрети беруться з файлу .env (скопіюйте .env.example), а не з коду.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: greenhouse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD у .env}
      POSTGRES_DB: greenhouse
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U greenhouse"]
      interval: 5s
      retries: 10

  api:
    build:
      context: .
      target: api
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      Database__Provider: Postgres
      ConnectionStrings__Greenhouse: Host=db;Database=greenhouse;Username=greenhouse;Password=${POSTGRES_PASSWORD}
      Auth__SensorApiKey: ${SENSOR_API_KEY:?задайте SENSOR_API_KEY у .env}
      Auth__AdminUsername: ${ADMIN_USERNAME:-admin}
      Auth__AdminPassword: ${ADMIN_PASSWORD:?задайте ADMIN_PASSWORD у .env}
      Auth__JwtSigningKey: ${JWT_SIGNING_KEY:?задайте JWT_SIGNING_KEY у .env (мінімум 32 символи)}
    volumes:
      - api-logs:/data/logs

  simulator:
    build:
      context: .
      target: simulator
    depends_on:
      - api
    environment:
      GREENHOUSE_API_KEY: ${SENSOR_API_KEY}
    command: ["--api", "http://api:8080", "--interval", "2", "--speed", "600"]
    restart: on-failure

volumes:
  pg-data:
  api-logs:
