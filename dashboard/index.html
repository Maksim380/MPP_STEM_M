<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Моніторинг теплиці</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Моніторинг теплиці</h1>
    <p id="conn" class="muted" role="status">Підключення…</p>
  </header>
  <main>
    <section id="cards" class="cards" aria-label="Поточні покази датчиків"></section>
    <section class="table-wrap">
      <h2>Останні виміри</h2>
      <table id="recent">
        <thead><tr><th>Час (UTC)</th><th>Датчик</th><th class="num">Значення</th></tr></thead>
        <tbody></tbody>
      </table>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
